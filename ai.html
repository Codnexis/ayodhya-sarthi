<!doctype html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayodhya Sarthi AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #ececf1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('https://i.ibb.co/qMykHqq4/file-00000bd887206b9024e32963bf06c.png') center/cover;
            filter: brightness(0.4);
            z-index: -1;
        }

       .header {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 153, 51, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

       .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 153, 51, 0.4);
            padding: 6px 10px;
            border-radius: 25px;
            background: rgba(255, 153, 51, 0.1);
        }

       .logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ff9933;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

       .header-title h1 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

       .speak-toggle {
            background: #ff9933;
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

       .speak-toggle.off {
            background: #565869;
            color: #fff;
        }

       .quick-wrap {
            margin: 12px;
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 153, 51, 0.2);
            border-radius: 20px;
            padding: 16px 12px;
        }

       .quick-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

       .action-card {
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 153, 51, 0.25);
            border-radius: 16px;
            padding: 10px 6px;
            flex: 1;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

       .action-card:hover {
            background: rgba(255,153,51,0.2);
        }

       .action-icon {
            font-size: 22px;
            margin-bottom: 6px;
            color: #ff9933;
        }

       .action-text {
            font-size: 10px;
            color: #ddd;
        }

        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

       .chat-card {
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 153, 51, 0.2);
            border-radius: 20px;
            padding: 16px;
            margin-top: 12px;
        }

       .msg-content {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

       .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #ff9933;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #ff9933;
            flex-shrink: 0;
        }

       .bubble {
            line-height: 1.7;
            font-size: 15px;
            max-width: 80%;
        }

       .bubble strong {
            color: #ff9933;
        }

       .user-bubble {
            background: linear-gradient(135deg, rgba(84, 54, 218, 0.9), rgba(120, 90, 240, 0.9));
            padding: 12px 16px;
            border-radius: 18px 18px 4px 18px;
            border: 1px solid rgba(120, 90, 240, 0.4);
            box-shadow: 0 4px 12px rgba(84, 54, 218, 0.3);
            backdrop-filter: blur(8px);
        }

       .bottom-wrap {
            padding: 0 12px 12px;
        }

       .suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 12px;
        }

       .chip {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 153, 51, 0.3);
            padding: 9px 14px;
            border-radius: 25px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

       .chip:hover {
            background: rgba(255,153,51,0.2);
        }

       .input-wrap {
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid rgba(255, 153, 51, 0.3);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 4px 6px;
            gap: 4px;
        }

        #userInput {
            flex: 1;
            background: none;
            border: none;
            color: #ececf1;
            padding: 10px 6px;
            outline: none;
            font-size: 15px;
        }

        #sendBtn {
            background: #ff9933;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: #000;
            font-size: 18px;
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

       .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff9933;
            display: inline-block;
            margin: 0 1px;
            animation: typing 1.4s infinite;
        }

       .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

       .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo-wrap">
            <div class="logo">🛕</div>
            <div class="header-title">
                <h1>Ayodhya Sarthi AI</h1>
            </div>
        </div>
        <button class="speak-toggle" id="speakToggle">🔊 Bolna On</button>
    </div>

    <div class="quick-wrap">
        <div class="quick-actions">
            <div class="action-card" data-q="Ram Mandir ke darshan ka time kya hai">
                <div class="action-icon">🛕</div>
                <div class="action-text">Ram Mandir</div>
            </div>
            <div class="action-card" data-q="Hanuman Garhi kaise jaye">
                <div class="action-icon">🙏</div>
                <div class="action-text">Hanuman Garhi</div>
            </div>
            <div class="action-card" data-q="Ayodhya me best hotels batao">
                <div class="action-icon">🏢</div>
                <div class="action-text">Hotels</div>
            </div>
        </div>
    </div>

    <div id="chatBox">
        <div class="chat-card">
            <div class="msg-content">
                <div class="avatar">AI</div>
                <div class="bubble">
                    Namaste 🙏 Main <strong>Ayodhya Sarthi AI</strong> hu.
                    Ayodhya yatra me main aapka sathi banunga.
                    Kya jaanna chahte hain?
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-wrap">
        <div class="suggestions">
            <div class="chip" data-q="Ayodhya darshan guide do">❓ Ayodhya Guide</div>
            <div class="chip" data-q="Ayodhya me saste hotels">🏨 Best Hotels</div>
            <div class="chip" data-q="Speak in English">🇬🇧 English</div>
        </div>
        <div class="input-wrap">
            <input id="userInput" placeholder="Sawal likho..." />
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        // 👇 YAHAN APNI GROQ API KEY DAALO
        const GROQ_API_KEY = "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";

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const speakToggle = document.getElementById("speakToggle");

        let isSpeakEnabled = true;
        let activeLanguage = "Hindi";

        function speak(text, langCode) {
            if (!isSpeakEnabled) {
                return;
            }

            if (!window.speechSynthesis) {
                return;
            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text.replace(/\*\*/g, ''));
            utterance.lang = langCode;
            utterance.rate = 0.95;

            window.speechSynthesis.speak(utterance);
        }

        speakToggle.onclick = () => {
            isSpeakEnabled =!isSpeakEnabled;
            speakToggle.classList.toggle("off");
            speakToggle.innerHTML = isSpeakEnabled? "🔊 Bolna On" : "🔇 Bolna Off";
        };

        function addMsg(text, who) {
            const chatCard = document.createElement("div");
            chatCard.className = "chat-card";

            if (who === "user") {
                chatCard.innerHTML = `
                    <div class="msg-content" style="flex-direction: row-reverse;">
                        <div class="avatar" style="background:#5436da; color:#fff; border:none;">You</div>
                        <div class="bubble user-bubble">${text}</div>
                    </div>
                `;
            } else if (who === "typing") {
                chatCard.innerHTML = `
                    <div class="msg-content">
                        <div class="avatar">AI</div>
                        <div class="bubble">
                            <div class="typing">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                `;
                chatCard.id = "typingCard";
            } else {
                chatCard.innerHTML = `
                    <div class="msg-content">
                        <div class="avatar">AI</div>
                        <div class="bubble">${text}</div>
                    </div>
                `;
            }

            chatBox.appendChild(chatCard);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setLanguage(q) {
            q = q.toLowerCase();

            if (q.includes("speak in english") || q.includes("english me baat karo")) {
                activeLanguage = "English";
                return {langName: "English", langCode: "en-US"};
            }

            if (q.includes("hindi me baat karo") || q.includes("speak in hindi")) {
                activeLanguage = "Hindi";
                return {langName: "Hindi", langCode: "hi-IN"};
            }

            return /[a-zA-Z]/.test(q)? {langName: "English", langCode: "en-US"} : {langName: "Hindi", langCode: "hi-IN"};
        }

        async function askAI(q) {
            if (!q) {
                return;
            }

            addMsg(q, "user");
            userInput.value = "";
            sendBtn.disabled = true;
            addMsg("", "typing");

            const {langName, langCode} = setLanguage(q);

            try {
                const systemPrompt = `You are Ayodhya Sarthi AI - a friendly and knowledgeable guide for Ayodhya tourism.

                MOST IMPORTANT RULES:
                1. ALWAYS reply in ${activeLanguage} language only. No mixing.
                2. If user greets with "hi", "hello", "namaste" then give a warm welcome in ${activeLanguage}.
                3. Be attractive, polite and helpful. End with 1-2 questions so user can reply easily.
                4. If language is Hindi, use pure Hindi and Devnagari script.
                5. Keep answers short: 4-5 lines maximum. Only talk about Ayodhya, temples, hotels, travel.`;

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: q }
                        ],
                        temperature: 0.7,
                        max_tokens: 300
                    })
                });

                const data = await response.json();
                document.getElementById("typingCard")?.remove();

                if (!response.ok) {
                    const errorMsg = data.error?.message || "API Error";
                    addMsg(`⚠️ Error: ${errorMsg}. API Key check karo.`, "bot");
                } else {
                    const ans = data.choices?.[0]?.message?.content || "Maaf karna, mai samjha nahi.";
                    addMsg(ans, "bot");
                    speak(ans, langCode);
                }
            } catch (e) {
                document.getElementById("typingCard")?.remove();
                addMsg("⚠️ Network Error: Internet check karo", "bot");
            }

            sendBtn.disabled = false;
        }

        sendBtn.onclick = () => {
            askAI(userInput.value.trim());
        };

        userInput.onkeydown = (e) => {
            if (e.key === "Enter") {
                askAI(userInput.value.trim());
            }
        };

        document.querySelectorAll('.action-card,.chip').forEach(el => {
            el.onclick = () => {
                askAI(el.dataset.q);
            };
        });
    </script>
</body>
</html>
